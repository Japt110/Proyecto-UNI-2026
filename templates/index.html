<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasantías - Universidad Nacional de Ingeniería (UNI)</title>
  
  <!-- Estilos base y variables -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout-components.css') }}">
  <!-- Nueva hoja de estilos fiel al PDF -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pasantias.css') }}">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
  <!-- Contenedor Principal de la Página de Pasantías -->
  <div id="pasantias-wrapper" class="pasantias-page-wrapper view-admin-mode">

    <!-- ====================================================================
         HEADER INSTITUCIONAL (PÁGINAS 3, 5, 6 DEL PDF)
         ==================================================================== -->
    <header class="pasantias-topbar">
      <!-- Logotipo Oficial UNI a la izquierda -->
      <a href="/" class="topbar-logo-link" title="Universidad Nacional de Ingeniería">
        <img src="{{ url_for('static', filename='img/uni_logo.png') }}" alt="Logo UNI" class="uni-topbar-logo">
      </a>

      <!-- Conmutador de Rol (Admin / Usuario) y Avatar de Usuario a la derecha -->
      <div class="topbar-actions-group">
        <!-- Switch visual para alternar y evaluar Vista Admin vs Vista Usuario -->
        <div class="role-toggle-pill" title="Alternar entre Vista Admin y Vista Usuario">
          <button type="button" id="role-toggle-admin" class="role-toggle-btn active">Vista Admin</button>
          <button type="button" id="role-toggle-usuario" class="role-toggle-btn">Vista Usuario</button>
        </div>

        <!-- Avatar circular del PDF (Abre el Drawer de Ajustes y Notificaciones - Pág 7) -->
        <button type="button" id="btn-profile-trigger" class="topbar-profile-avatar-btn" title="Abrir Ajustes y Perfil">
          <i data-lucide="user"></i>
        </button>
      </div>
    </header>

    <!-- ====================================================================
         BOTÓN "AGREGAR PASANTIA" (VISTA ADMIN - PÁGINA 3 DEL PDF)
         ==================================================================== -->
    <div class="admin-action-container">
      <button type="button" id="btn-agregar-pasantia" class="btn-agregar-pasantia">
        <span>AGREGAR PASANTIA</span>
      </button>
    </div>

    <!-- ====================================================================
         BARRA DE BÚSQUEDA Y FILTROS TIPO PASTILLA (PÁGINAS 3, 5, 6 DEL PDF)
         ==================================================================== -->
    <section class="pasantias-filter-section">
      <!-- Input de búsqueda centrado -->
      <div class="pasantias-search-bar">
        <input 
          type="text" 
          id="pasantias-search-input" 
          class="pasantias-search-input" 
          placeholder="Buscar pasantia" 
          autocomplete="off" 
        />
        <i data-lucide="search" class="pasantias-search-icon"></i>
      </div>

      <!-- Fila de filtros tipo pill (EXPERIENCIA, MODALIDAD, SECTOR, CIUDAD) -->
      <div class="pasantias-pills-row">
        <!-- Filtro 1: EXPERIENCIA -->
        <div class="filter-dropdown-container" data-filter-key="experiencia">
          <button type="button" class="filter-pill-button" id="btn-filter-experiencia">
            <span class="pill-text">EXPERIENCIA</span>
            <i data-lucide="chevron-down"></i>
          </button>
          <div class="filter-dropdown-menu">
            <button type="button" class="filter-dropdown-item" data-value="">Todas</button>
            <button type="button" class="filter-dropdown-item" data-value="Sin experiencia">Sin experiencia</button>
            <button type="button" class="filter-dropdown-item" data-value="Prácticas">Prácticas</button>
            <button type="button" class="filter-dropdown-item" data-value="Junior">Junior</button>
          </div>
        </div>

        <!-- Filtro 2: MODALIDAD (En la Pág 6 se ilumina en azul sólido como 'PRESENCIAL') -->
        <div class="filter-dropdown-container" data-filter-key="modalidad">
          <button type="button" class="filter-pill-button" id="btn-filter-modalidad">
            <span class="pill-text">MODALIDAD</span>
            <i data-lucide="chevron-down"></i>
          </button>
          <div class="filter-dropdown-menu">
            <button type="button" class="filter-dropdown-item" data-value="">Todas</button>
            <button type="button" class="filter-dropdown-item" data-value="Presencial">Presencial</button>
            <button type="button" class="filter-dropdown-item" data-value="Virtual">Virtual</button>
            <button type="button" class="filter-dropdown-item" data-value="Híbrida">Híbrida</button>
          </div>
        </div>

        <!-- Filtro 3: SECTOR -->
        <div class="filter-dropdown-container" data-filter-key="sector">
          <button type="button" class="filter-pill-button" id="btn-filter-sector">
            <span class="pill-text">SECTOR</span>
            <i data-lucide="chevron-down"></i>
          </button>
          <div class="filter-dropdown-menu">
            <button type="button" class="filter-dropdown-item" data-value="">Todos</button>
            <button type="button" class="filter-dropdown-item" data-value="Tecnología">Tecnología / TI</button>
            <button type="button" class="filter-dropdown-item" data-value="Química">Ing. Química</button>
            <button type="button" class="filter-dropdown-item" data-value="Industrial">Ing. Industrial</button>
            <button type="button" class="filter-dropdown-item" data-value="Civil">Ing. Civil</button>
            <button type="button" class="filter-dropdown-item" data-value="Eléctrica">Ing. Eléctrica</button>
          </div>
        </div>

        <!-- Filtro 4: CIUDAD -->
        <div class="filter-dropdown-container" data-filter-key="ciudad">
          <button type="button" class="filter-pill-button" id="btn-filter-ciudad">
            <span class="pill-text">CIUDAD</span>
            <i data-lucide="chevron-down"></i>
          </button>
          <div class="filter-dropdown-menu">
            <button type="button" class="filter-dropdown-item" data-value="">Todas</button>
            <button type="button" class="filter-dropdown-item" data-value="Managua">Managua</button>
            <button type="button" class="filter-dropdown-item" data-value="Chinandega">Chinandega</button>
            <button type="button" class="filter-dropdown-item" data-value="León">León</button>
            <button type="button" class="filter-dropdown-item" data-value="Estelí">Estelí</button>
            <button type="button" class="filter-dropdown-item" data-value="Matagalpa">Matagalpa</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ====================================================================
         INDICADOR DE ESTADO "ACTIVO" (PÁGINAS 3, 5, 6 DEL PDF)
         ==================================================================== -->
    <div class="pasantias-status-indicator">
      <span class="status-dot-green"></span>
      <span class="status-text-label">Activo</span>
    </div>

    <!-- ====================================================================
         GRID DE TARJETAS DE PASANTÍAS (3 COLUMNAS)
         ==================================================================== -->
    <main id="pasantias-grid" class="pasantias-grid-container">
      <!-- Se inyecta dinámicamente desde pasantias.js con tarjetas fieles al PDF -->
    </main>

  </div>

  <!-- ====================================================================
       DRAWER LATERAL DE AJUSTES & NOTIFICACIONES (PÁGINA 7 DEL PDF)
       ==================================================================== -->
  <div id="uni-drawer-backdrop" class="uni-backdrop"></div>
  
  <aside id="uni-drawer-panel" class="uni-drawer-panel" aria-label="Ajustes de Usuario y Notificaciones">
    <!-- Fila superior: Botón '>' para colapsar hacia la derecha -->
    <div class="drawer-top-row">
      <button type="button" id="btn-drawer-collapse" class="btn-drawer-collapse" title="Cerrar panel">
        <i data-lucide="chevron-right"></i>
      </button>
    </div>

    <!-- Sección de Perfil de Usuario -->
    <div class="drawer-profile-section">
      <div class="drawer-profile-avatar-circle">
        <i data-lucide="user"></i>
      </div>
      <h3 class="drawer-user-name">Juan Alejandro</h3>
      <span class="drawer-user-cup">#CUP 8k4B7UP5</span>

      <!-- Botón 'Ajustes' con icono de engranaje -->
      <a href="/perfil" class="btn-drawer-ajustes" id="btn-drawer-ajustes" title="Ir a Configuración de Perfil">
        <i data-lucide="settings"></i>
        <span>Ajustes</span>
      </a>
    </div>

    <!-- Sección 'Notificaciones' con tarjeta oscura y acento rojo -->
    <div class="drawer-notifications-section">
      <span class="notifications-heading">Notificaciones</span>
      
      <div id="drawer-notifications-list">
        <!-- Notificación fija fiel al mockup de la Página 7 -->
        <div class="notification-card-item">
          <div class="notif-avatar-col">
            <div class="notif-avatar-circle">
              <i data-lucide="user"></i>
            </div>
          </div>
          <div class="notif-body-col">
            <h5 class="notif-title">Pasantia #</h5>
            <p class="notif-text">texto de descripcion....</p>
            <div class="notif-buttons-row">
              <button type="button" class="btn-notif-aceptar" onclick="window.pasantiasApp.showToast('Pasantía aceptada correctamente', 'success')">Aceptar</button>
              <button type="button" class="btn-notif-vermas" onclick="window.pasantiasApp.showToast('Visualizando detalles completos', 'info')">Ver mas</button>
            </div>
          </div>
          <button type="button" class="btn-notif-dismiss" title="Cerrar notificación">
            <i data-lucide="x"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Botón inferior rojo: Cerrar Sesión -->
    <div class="drawer-footer-section">
      <a href="/login" id="btn-drawer-logout" class="btn-drawer-cerrar-sesion">
        <i data-lucide="power"></i>
        <span>Cerrar Sesion</span>
      </a>
    </div>
  </aside>

  <!-- ====================================================================
       MODAL PARA "AGREGAR PASANTIA" (VISTA ADMIN)
       ==================================================================== -->
  <div id="modal-agregar-pasantia" class="uni-modal-overlay">
    <div class="uni-modal-content">
      <div class="uni-modal-header">
        <h3>Publicar Nueva Pasantía</h3>
        <button type="button" id="btn-close-modal" class="btn-close-modal">
          <i data-lucide="x"></i>
        </button>
      </div>

      <form id="form-agregar-pasantia">
        <div class="uni-modal-body">
          <div class="modal-form-group">
            <label for="modal-pasantia-titulo">Título de la Pasantía *</label>
            <input type="text" id="modal-pasantia-titulo" class="modal-form-input" placeholder="Ej: Pasantía en Desarrollo Web" required />
          </div>

          <div class="modal-form-row">
            <div class="modal-form-group">
              <label for="modal-pasantia-tipo">Tipo de Pasantía</label>
              <select id="modal-pasantia-tipo" class="modal-form-select">
                <option value="Académica">Académica</option>
                <option value="Profesional">Profesional</option>
              </select>
            </div>
            <div class="modal-form-group">
              <label for="modal-pasantia-modalidad">Modalidad</label>
              <select id="modal-pasantia-modalidad" class="modal-form-select">
                <option value="Presencial">Presencial</option>
                <option value="Virtual">Virtual</option>
                <option value="Híbrida">Híbrida</option>
              </select>
            </div>
          </div>

          <div class="modal-form-row">
            <div class="modal-form-group">
              <label for="modal-pasantia-horas">Horas Requeridas</label>
              <input type="text" id="modal-pasantia-horas" class="modal-form-input" placeholder="Ej: 160H" value="160H" />
            </div>
            <div class="modal-form-group">
              <label for="modal-pasantia-experiencia">Nivel de Experiencia</label>
              <select id="modal-pasantia-experiencia" class="modal-form-select">
                <option value="Sin experiencia">Sin experiencia</option>
                <option value="Prácticas">Prácticas</option>
                <option value="Junior">Junior</option>
              </select>
            </div>
          </div>

          <div class="modal-form-row">
            <div class="modal-form-group">
              <label for="modal-pasantia-sector">Sector / Especialidad</label>
              <select id="modal-pasantia-sector" class="modal-form-select">
                <option value="Tecnología">Tecnología / Sistemas</option>
                <option value="Química">Ingeniería Química</option>
                <option value="Industrial">Ingeniería Industrial</option>
                <option value="Civil">Ingeniería Civil</option>
                <option value="Eléctrica">Ingeniería Eléctrica</option>
              </select>
            </div>
            <div class="modal-form-group">
              <label for="modal-pasantia-ciudad">Ciudad</label>
              <select id="modal-pasantia-ciudad" class="modal-form-select">
                <option value="Managua">Managua</option>
                <option value="Chinandega">Chinandega</option>
                <option value="León">León</option>
                <option value="Estelí">Estelí</option>
                <option value="Matagalpa">Matagalpa</option>
              </select>
            </div>
          </div>

          <div class="modal-form-group">
            <label for="modal-pasantia-desc">Descripción Detallada *</label>
            <textarea id="modal-pasantia-desc" class="modal-form-textarea" rows="3" placeholder="Describe los requisitos y actividades de la pasantía..." required></textarea>
          </div>
        </div>

        <div class="uni-modal-footer">
          <button type="button" id="btn-cancel-modal" class="btn-modal-cancel">Cancelar</button>
          <button type="submit" class="btn-modal-submit">Publicar Pasantía</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="{{ url_for('static', filename='js/pasantias.js') }}"></script>
</body>

</html>
