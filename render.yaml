# ===============================================================================
# EVENTOS-UNI - RENDER BLUEPRINT (INFRASTRUCTURE-AS-CODE)
# Especificación de despliegue automático para OnRender.com
# ===============================================================================

services:
  # -----------------------------------------------------------------------------
  # 1. Servidor Web Backend Principal (Flask + Gunicorn)
  # -----------------------------------------------------------------------------
  - type: web
    name: eventos-uni-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --config gunicorn.conf.py app:app"
    env: python
    region: oregon # o la región más cercana a tu proyecto de Supabase
    plan: standard
    healthCheckPath: /favicon.ico
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true # Render genera una clave criptográfica de 256 bits segura
      - key: DATABASE_URL
        sync: false # Pega aquí la Connection String de UNI-CLUSTER-PRIMARIO (Supabase)
      - key: DATABASE_READ_URL
        sync: false # Opcional: Connection String de UNI-CLUSTER-REPLICA (Supabase)
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: DB_POOL_TIMEOUT
        value: "30"
      - key: DB_POOL_RECYCLE
        value: "1800"
      - key: REDIS_URL
        fromService:
          type: redis
          name: eventos-uni-redis
          property: connectionString
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"

  # -----------------------------------------------------------------------------
  # 2. Instancia de Redis para Sesiones Compartidas y Caché
  # -----------------------------------------------------------------------------
  - type: redis
    name: eventos-uni-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # Solo accesible internamente por el backend en la red privada de Render
