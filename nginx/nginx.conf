# ===============================================================================
# EVENTOS-UNI - CONFIGURACIÓN DE NGINX API GATEWAY & LOAD BALANCER (ROUND-ROBIN)
# Capa 2: Perímetro de Seguridad, Terminación TLS 1.3 y Balanceo de Carga
# ===============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Formato de Logs de Acceso con Telemetría
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 16M;

    # Compresión Gzip para optimizar ancho de banda
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript image/svg+xml;

    # ---------------------------------------------------------------------------
    # Rate Limiting Perimetral (Anti-DoS / Inundación)
    # ---------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ---------------------------------------------------------------------------
    # Clúster de Backend Stateless (Round-Robin entre Nodos Flask/Gunicorn)
    # ---------------------------------------------------------------------------
    upstream backend_cluster {
        least_conn; # Distribución de carga por menor número de conexiones activas
        server app-1:5000 max_fails=3 fail_timeout=10s;
        server app-2:5000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # Servidor HTTP - Redirección a HTTPS / Proxy Local
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Headers Globales de Hardening OWASP
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Enrutamiento de Archivos Estáticos con Cache de Navegador
        location /static/ {
            proxy_pass http://backend_cluster;
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        # Rate Limiting estricto en Login / Auth
        location /api/auth/login {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rate Limiting general para la API REST y Sincronización
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # Vistas Web y Raíz
        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
